title: DeeControl
tooltip: Control Panel - grey out any DeePack button, dropdown item or whole panel you do not want, each shown with a one-line brief of what it does. Switched-off buttons stay on the ribbon, faded and unclickable, rather than disappearing. Unticking a panel greys everything inside it. About and DeeControl are always on so you can never lock yourself out.
context: zero-doc

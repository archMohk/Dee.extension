title: DeeStairs
tooltip: Create component stairs with every option in one window, a live plan preview and a live section sketch - straight, straight with a landing, L-shape or U-shape on a landing, L-shape or U-shape with winders, and spiral. Set the levels and offsets, number of risers, tread depth, run width, location line, begin and end with a riser, and the stair type or a customised copy of it. Choose a finish - cherry, oak with white risers, timber on folded steel, steel carriage, floating timber, marble, granite, concrete, glass and steel, white painted - or mix your own with a material for the treads, risers, stringers and landings plus the finished thickness, nosing, open risers and supports. Add railings on one or both sides and repeat the stairs on the levels above as a multistory stair. Then click the start point and the direction in the plan view - one Undo step.

title: DeeStairs
tooltip: Create component stairs with every option in one window and a live plan preview - straight, straight with a landing, L-shape or U-shape on a landing, L-shape or U-shape with winders, and spiral. Set the levels and offsets, number of risers, tread depth, run width, location line, begin and end with a riser, and the stair type or a customised copy of it (maximum riser, minimum tread, open risers, thicknesses, side and middle supports). Add railings on one or both sides and repeat the stairs on the levels above as a multistory stair. Then click the start point and the direction in the plan view - one Undo step.

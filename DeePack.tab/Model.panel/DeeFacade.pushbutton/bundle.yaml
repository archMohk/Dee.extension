title: DeeFacade
tooltip: Pick a wall and design a perforated facade on it with live preview - Voronoi, hexagons, diamonds, grid slots, circles, Mashrabiya stars, triangles, wave slots or pixel blocks, each with its own sliders, plus attractor points you click on the preview to make the pattern more open or more closed around them. Then either cut the pattern into the wall's own profile sketch, or build a Generic Model family panel from the wall and place it as a replacement or a screen.

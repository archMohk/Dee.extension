title: DeeFacade
tooltip: Pick a wall and design a perforated facade on it with live preview - Voronoi, hexagons, diamonds, grid slots or circles, each with its own sliders (cells, size, regularity, mullion, border, corner rounding, fade). Then either cut the pattern into the wall's own profile sketch, or build a Generic Model family panel from the wall and place it as a replacement or a screen.

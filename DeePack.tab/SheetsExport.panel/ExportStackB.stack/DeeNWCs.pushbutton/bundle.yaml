title: DeeNWCs
tooltip: Batch-export views to NWC, from either your currently-open document(s) or an ACC/BIM360 project (browse and batch-open selected files). An options window lets you set which text the view name must contain (not just 'NAVIS' anymore), and the full set of Navisworks exporter settings (coordinates, faceting factor, linked files/CAD, room/element data, and more) - remembered between runs. Super Config skips pre-named views entirely: it creates (or reuses) a dedicated export view per document, hides Levels/Grids (and optionally Scope Boxes/Reference Planes/Sun Path), and sets discipline/phase for you.
context: zero-doc

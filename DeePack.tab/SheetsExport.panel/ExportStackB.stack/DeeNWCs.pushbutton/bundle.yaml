title: DeeNWCs
tooltip: Batch-export views to NWC, from either your currently-open document(s) or an ACC/BIM360 project (browse and batch-open selected files). An options window lets you set which text the view name must contain (not just 'NAVIS' anymore), and the full set of Navisworks exporter settings (coordinates, faceting factor, linked files/CAD, room/element data, and more) - remembered between runs.
context: zero-doc

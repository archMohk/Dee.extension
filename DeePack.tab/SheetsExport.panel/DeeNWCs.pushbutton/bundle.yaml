title: DeeNWCs
tooltip: "Batch-export views to NWC, from either your currently-open document(s) or an ACC/BIM360 project (browse and batch-open selected files). An options window lets you set which text the view name must contain (not just 'NAVIS' anymore), and the full set of Navisworks exporter settings (coordinates, faceting factor, linked files/CAD, room/element data, and more) - remembered between runs. Super Config skips pre-named views entirely - it creates (or reuses) a dedicated export view per document, hides Levels/Grids (and optionally Scope Boxes/Reference Planes/Sun Path), and sets discipline/phase for you. Label your file-naming convention once (e.g. Project-Discipline-Level) to sort exports into subfolders and name the output files by those same parts - with a preview shown before anything actually exports. Save the NWC files to a local folder or straight to an ACC/BIM360 folder - pick it, add a new folder there if you need one, and files already there get a new version. Run by more than one Revit - background Revits are started for you and export different models at the same time."
context: zero-doc

title: DeeDropToSurface
tooltip: Pick any elements, then pick a Floor or Toposolid - each picked element is moved straight up/down (its own X/Y position is never changed) to rest exactly on that surface. Every element gets its own vertical offset based on the surface's elevation directly below it, so a sloped Floor or Toposolid is respected instead of applying one flat move to everything. Straight walls get a stronger fix - since Revit's own Attach Base has no scriptable API, a picked wall is DELETED and REBUILT with a stepped bottom edge that actually follows the slope (asks first - any doors/windows hosted on that wall are lost and need re-placing). Pinned elements are skipped and reported, not force-moved.

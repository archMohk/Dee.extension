title: DeeBIMview
tooltip: Create the BIM Coordination + NAVIS views (RVT links hidden) in batch from one window - either on ACC cloud files (pick hub, project and files; each is opened for you) or on the documents already open in your Revit session. Tick the steps to run (views only by default; optionally Publish Settings, Sync, and on ACC files Close and Publish) and edit the view and set names right in the window.
context: zero-doc

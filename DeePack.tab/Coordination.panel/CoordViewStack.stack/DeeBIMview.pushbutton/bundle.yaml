title: DeeBIMview
tooltip: Create the BIM Coordination + NAVIS views in batch from one window - either on ACC cloud files (pick hub, project and files; each is opened for you) or on the documents already open in your Revit session. Revit Links are hidden in the Coordination and NAVIS views by default - untick the option for either view to show its links. Optionally also Synchronize With Central; on ACC files you can additionally Close and Publish. Views-only by default.
context: zero-doc

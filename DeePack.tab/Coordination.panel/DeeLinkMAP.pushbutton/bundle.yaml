title: DeeLinkMAP
tooltip: Scan an ACC project or local folder for Revit files and map each one's own Revit links - each file is opened headlessly and closed, one at a time. Produces an interactive HTML map opened in your browser, color-coded by discipline (AR/ST/ME/...) detected from each file's name. Large batches stop themselves cleanly after a time budget rather than risk a crash. SHIFT+Click to edit the discipline code list.
context: zero-doc

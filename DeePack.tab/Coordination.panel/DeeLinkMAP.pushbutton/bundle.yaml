title: DeeLinkMAP
tooltip: Map which Revit files link which. On an ACC project the links are read straight from ACC with nothing opened - a whole project answers in seconds. Only models ACC cannot answer for (published the older "without links" way) are opened headlessly one at a time; a local folder is always read that way. Produces an interactive HTML map, color-coded by discipline (AR/ST/ME/...) detected from each file's name. SHIFT+Click to edit the discipline code list.
context: zero-doc

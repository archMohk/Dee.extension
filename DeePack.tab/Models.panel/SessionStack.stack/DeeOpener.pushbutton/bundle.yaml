title: DeeOpener
tooltip: Batch-open Revit models from EITHER an ACC/BIM360 project or your local/network drives. Browse a cloud project by checkbox, or pick local files / scan a folder (with subfolders) - local models are classified as Central, Local Copy or Standalone before you choose. Open normally or with all worksets closed, and a workshared Central can be turned into a new local copy first instead of being opened directly.
context: zero-doc
